# docs/024: the full-scale run on r1 (Dama's RTX PRO 6000s, 40 GiB of RAM): configs/gnn_train.yml's recipe with the
# training rows streamed into a memory-mapped cache in r1's persistent home (stream_cache; 37 GB; not /var/tmp, whose
# ~40 GB storage cap evicted the container twice, docs/024). The architecture and epochs are set from rounds 7-8 (docs/024).
#
# docs/022, stage 3: the GNN's large training, with the 10% sweep's recipe (docs/023): MageZero's graph network at
# width 256, embeddings drawn at std 0.02, dropout 0.1, the game result as the value target, lr 1e-4, 256 states a
# step, three epochs of all the training games (three epochs of 10%: set NLL 0.256 against one epoch's 0.295; five:
# 0.247). Will's settings (width 512, N(0, 1) embeddings, dropout 0.25, TD(0.99) targets, lr 1e-4 at batch 64) gave
# 0.324-0.336 at 10%.
#
#   bash deploy/gnn_train.sh                               # on a pod with ~150 GB of RAM: the first load holds every row
#   python -m draftzero.gameplay.graph_supervised train --config configs/gnn_train.yml --out runs/gnn/main \
#       --tables-dir data/imitation_graph/slim
#   python -m draftzero.gameplay.graph_supervised train --out runs/gnn/main --resume            # after a stop
#   python -m draftzero.gameplay.graph_supervised evaluate --checkpoint runs/gnn/main/best_policy.pt.gz \
#       --split test --tables-dir data/imitation_graph/slim --json runs/gnn/main/test_best_policy.json
#
# Writes runs/gnn/main/: evals.jsonl, best_policy / best_value / best .pt.gz (MageZero's graph checkpoint layout),
# ckpt/step*.pt.gz every 30 minutes, latest.pt, final.pt.gz, summary.json.
tables:
  - {name: turnstart, kind: priority_set}
  - {name: replay_priority, kind: priority_set}
  - {name: opp_priority, kind: priority_set}
  - {name: replay_attack, kind: binary}
  - {name: replay_target, kind: target}
  - {name: opp_block, kind: target}
fraction: 1.0
val_rows: 20000
XX
stream_cache: true             # never a whole table in RAM
arch: {d_model: 256, ff: 512, dropout: 0.1}   # graph_net.ARCH_DEFAULT otherwise: 4 heads, 2 local passes, 2 global layers
emb_init_std: 0.02
lr: 1.0e-4
warmup_steps: 750
lr_schedule: cosine
value_target: result
value_per_game: 16
value_weight: 0.5
act_weights: {opp_priority: 3.0, replay_priority: 3.0}
batch_rows: 256
max_epochs: 3
time_budget_s: 28800
eval_every_steps: 10650        # about a quarter epoch (~42.6k steps of 256 states)
ckpt_every_s: 1800
latest_every_s: 600
