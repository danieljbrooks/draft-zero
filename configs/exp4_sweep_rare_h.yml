# Experiment #4: the MLP's follow-ups for rarely seen features and decisions (Dan, 2026-10-03 18:20; docs/018).
# Base: the best MLP (m4-best: 2 blocks, width 1024, max pooling, SwiGLU, no dropout, token dropout 0.1, the
# passivity fix on both own-turn tables, TD(0.99)) on 10% of the games, one epoch. Max pooling barely moves the
# feature embeddings (1-4% of their random start, against 23-38% under mean pooling): the network runs on near-random
# feature codes, so rare features never get a learned meaning.
# Wave H (23:40): wave G's verdict: only weight decay 0.1 stops the 3-epoch overfitting (set NLL still falling, 0.2591
# at 2.77 epochs; value log-loss 0.66 against the control's 0.95), but it learns slowly early; token dropout 0.3 has the
# best early curve (0.2627 at 1.37) then overfits. Here: the two together, and a lighter decay (0.03).
# Wave G (Dan, 22:55): wave F showed the leading recipe overfitting after ~1.25 epochs on 10% of the games (set NLL
# 0.267 -> 0.323 at 2.77 epochs, value log-loss 0.59 -> 0.95), and dropout 0.1 didn't slow it. One change each against
# f0-3ep-drop0 (the control, same 3 epochs): weight decay 0.01 / 0.1 (AdamW, every parameter; the table's decay
# scales with its 30x rate), token dropout 0.3, the table at 10x, 4 value positions a game.
# Wave F (Dan, 22:40): small dropout on the leading recipe over 3 epochs (every earlier MLP run was one epoch, where
# dropout only slowed learning; the full run repeats each decision). Dropout in the blocks and on the pooled vector at
# 0.1 and 0.2, against 0 (the leader's) at the same 3 epochs. The winner joins d1-s30-combined's recipe for the
# full-data run.
# Wave C (19:25): waves A and B's winners together: features seen in > 3 states (b1b: 0.262), max + mean pooling with
# the table at 30x (a6b: 0.2605, attack 0.829), heads 1024 (b5: targets 0.601); a seed repeat of the combination.
# (Wave B's note:) keep rarer features (vocab_k: drop features seen in <= k training states; 10 drops 38% of a state's
# tokens at 30%), and wider heads (each squeezes the state to 256; the value head uses ~7 dimensions, 54 dead units).
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_rare_h.yml --out runs/exp4/sweep_rare_h \
#       --tables-dir data/imitation_scale/h5 --follow --follow-idle 600
title: "Experiment #4 sweep: rare features and decisions (wave H: weight decay, tuned and combined)"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  vocab_k: 3
  val_rows: 20000
  max_epochs: 3.0
  time_budget_s: 14400
  eval_every_s: null
  eval_every_steps: 7100
  ckpt_every_s: null
  latest_every_s: 300
  patience_epochs: null
  arch: {type: mlp, layers: 2}
  emb_init_std: 0.02
  warmup_steps: 3000
  lr: 1.0e-4
  lr_schedule: cosine
  value_target: td
  td_lambda: 0.99
  value_per_game: 16
  act_weights: {opp_priority: 3.0}
runs:
  - {name: h1-3ep-wd0.1-tok0.3, token_dropout: 0.3, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, emb_lr_mult: 30.0, weight_decay: 0.1, arch: {type: mlp, layers: 2, width: 1024, bag_mode: maxmean, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, head_hidden: 1024}}
  - {name: h2-3ep-wd0.03, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, emb_lr_mult: 30.0, weight_decay: 0.03, arch: {type: mlp, layers: 2, width: 1024, bag_mode: maxmean, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, head_hidden: 1024}}
