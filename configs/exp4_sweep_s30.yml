# Experiment #4, stage 2: the scale check (docs/018). Round 2's best recipe (TD + cosine from 1e-4, 16 value positions) at 30% of the training games (3.3M rows,
# 3x round 2's subset), one epoch each, to see whether the ranking holds with more data and whether capacity
# starts to pay: the goal is a recipe that works at full scale (stage 3: all 10.9M rows, several epochs).
# The validation rows are round 1's and 2's (val_rows and val_seed unchanged), so the numbers compare directly.
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_s30.yml --out runs/exp4/sweep_s30 \
#       --tables-dir data/imitation_scale/h5 --follow --follow-idle 10800
title: "Experiment #4 sweep, scale check: round 2's recipe on 30% of the training games"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.3
  val_rows: 20000
  max_epochs: 1.0
  time_budget_s: 21600        # a cap only
  eval_every_s: null
  eval_every_steps: 15506     # quarter epochs (an epoch of 30% is ~62k steps)
  ckpt_every_s: null
  latest_every_s: 600
  patience_epochs: null
  # round 2's leader (19:08), v16-td-cosine-1e-4: TD(0.95) value targets, warm-up + cosine from 1e-4
  arch: {layers: 1, norm_first: true}
  emb_init_std: 0.02
  warmup_steps: 3000
  lr: 1.0e-4
  lr_schedule: cosine
  value_target: td
  value_per_game: 16
runs:
  - {name: s30-l1, role: default}
  - {name: s30-l2, arch: {layers: 2}}
  # 20:42 the passivity fix (x3 on the opponent's-turn acted rows), 21:20 with TD(0.99) (Dan): the candidate stage-3 recipe
  - {name: s30-l1-act3-td99, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # 21:52: capacity on the candidate recipe (compare with s30-l1-act3-td99); 2 layers lost on the old one, so 4 goes last
  - {name: s30-mlp, arch: {type: mlp, layers: 2}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # - {name: s30-l1-w1024, arch: {width: 1024}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}   # dropped at 22:40 (Dan): level at a quarter epoch, 2.7x slower inference; stage 3 starts sooner
  # 22:25: x3 on all three priority tables beats x3 on the opponent's turn alone at 10% (non-Pass +0.011): check it at 30%
  # before stage 3, in place of 4 layers (2 layers already lost at 30%)
  - {name: s30-l1-actall3-td99, act_weights: {opp_priority: 3.0, replay_priority: 3.0, turnstart: 3.0}, td_lambda: 0.99}
  # - {name: s30-l4, arch: {layers: 4}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # 22:44: the value tower leads at 10% (policy NLL -0.012): check it at 30% before stage 3
  - {name: s30-vt-act3-td99, arch: {value_tower: true, value_layers: 1}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # 23:20: x3 on all tables at 30%: the player's own later stops gain (Pass on top 0.658 against the humans' 0.666, set NLL
  # -0.009) but the turn start overshoots (0.021 against 0.051). The candidate stage-3 recipe: the value tower with x3 on
  # the opponent's turn and the player's later stops, none at the turn start
  # - {name: s30-vt-actor3-td99, arch: {value_tower: true, value_layers: 1}, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99}
  # 00:06: stopped at the start for the two cheaper candidates: the value tower at 30% (s30-vt-act3-td99) gained NLL -0.005 at
  # 2.3x the training time, and at 10% an MLP value tower beside the transformer (x-vt-mlp) kept most of the policy gain
  # (NLL -0.011) at 4,788 evaluations a second. The stage-3 candidates, exactly:
  - {name: s30-l1-actor3-td99, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99}
  # - {name: s30-vtmlp-actor3-td99, arch: {value_tower: true, value_tower_type: mlp, value_layers: 2}, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99}   # dropped 00:20 (Dan chose the single tower)
