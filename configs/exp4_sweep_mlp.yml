# Experiment #4, stage 2: the MLP's own sweep (docs/018). Stage 3 trains two models (Dan, 22:55): the transformer for
# quality and an MLP for fast search on CPUs (one core: 0.39 ms an evaluation against the transformer's ~80 ms). The
# MLP has only run on the transformer's recipe so far. The same 10% subset, validation rows and budget as round 2;
# the base, m0, is the transformer's recipe on MageZero's bag-of-tokens MLP (2 residual blocks, width 512, LayerNorm,
# ReLU, dropout 0.1, pooling dropout 0.2, token dropout 0.3). One setting at a time first, combinations next.
# Reference: Dan's statistical-drafting MLP (Linear -> GELU -> Dropout 0.6 -> BatchNorm, Adam at lr 0.03).
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_mlp.yml --out runs/exp4/sweep_mlp \
#       --tables-dir data/imitation_scale/h5 --follow --follow-idle 10800
title: "Experiment #4 sweep: the MLP's own hyperparameters"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  val_rows: 20000
  max_epochs: 1.0
  time_budget_s: 7200
  eval_every_s: null
  eval_every_steps: 5169
  ckpt_every_s: null
  latest_every_s: 300
  patience_epochs: null
  arch: {type: mlp, layers: 2}
  emb_init_std: 0.02
  warmup_steps: 3000
  lr: 1.0e-4
  lr_schedule: cosine
  value_target: td
  td_lambda: 0.99
  value_per_game: 16
  act_weights: {opp_priority: 3.0}
runs:
  - {name: m0, role: default}
  # learning rate (MLPs usually take higher rates than transformers)
  - {name: m-lr-3e-4, lr: 3.0e-4}
  - {name: m-lr-1e-3, lr: 1.0e-3}
  - {name: m-lr-3e-3, lr: 3.0e-3}
  # statistical-drafting's style: GELU, BatchNorm, heavy dropout, a high rate
  - {name: m-sd-1e-3, lr: 1.0e-3, arch: {type: mlp, layers: 2, ffn: gelu, mlp_norm: batch, dropout: 0.6, pool_dropout: 0.6}}
  - {name: m-sd-1e-2, lr: 1.0e-2, arch: {type: mlp, layers: 2, ffn: gelu, mlp_norm: batch, dropout: 0.6, pool_dropout: 0.6}}
  # normalisation and activation
  - {name: m-batchnorm, arch: {type: mlp, layers: 2, mlp_norm: batch}}
  - {name: m-nonorm, arch: {type: mlp, layers: 2, mlp_norm: none}}
  - {name: m-gelu, arch: {type: mlp, layers: 2, ffn: gelu}}
  - {name: m-swiglu, arch: {type: mlp, layers: 2, ffn: swiglu}}
  # dropout: hidden + pooled, and on the input tokens
  - {name: m-drop-0, arch: {type: mlp, layers: 2, dropout: 0.0, pool_dropout: 0.0}}
  - {name: m-drop-0.3, arch: {type: mlp, layers: 2, dropout: 0.3, pool_dropout: 0.3}}
  - {name: m-drop-0.5, arch: {type: mlp, layers: 2, dropout: 0.5, pool_dropout: 0.5}}
  - {name: m-tokdrop-0, token_dropout: 0.0}
  - {name: m-tokdrop-0.5, token_dropout: 0.5}
  # pooling: the mean loses absolute counts (creatures, cards in hand)
  - {name: m-sum, arch: {type: mlp, layers: 2, bag_mode: sum}}
  - {name: m-max, arch: {type: mlp, layers: 2, bag_mode: max}}
  # size (cheap on a CPU)
  - {name: m-w1024, arch: {type: mlp, layers: 2, width: 1024}}
  - {name: m-b4, arch: {type: mlp, layers: 4}}
  - {name: m-w1024-b4, arch: {type: mlp, layers: 4, width: 1024}}
  - {name: m-w2048, arch: {type: mlp, layers: 2, width: 2048}}
  # weight decay (AdamW), and the passivity fix on all three tables
  - {name: m-wd-0.01, weight_decay: 0.01}
  - {name: m-wd-0.1, weight_decay: 0.1}
  - {name: m-actall3, act_weights: {opp_priority: 3.0, replay_priority: 3.0, turnstart: 3.0}}
  # 07:00: wave 3. Pooling is the big lever (max: set NLL 0.291, -0.036; sum: 0.304, -0.024: the mean loses counts),
  # combined with the second wave's winners (SwiGLU, no dropout)
  - {name: m3-max-swiglu-drop0, arch: {type: mlp, layers: 2, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0}}
  - {name: m3-sum-swiglu-drop0, arch: {type: mlp, layers: 2, bag_mode: sum, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0}}
  - {name: m3-max-gelu-drop0, arch: {type: mlp, layers: 2, bag_mode: max, ffn: gelu, dropout: 0.0, pool_dropout: 0.0}}
