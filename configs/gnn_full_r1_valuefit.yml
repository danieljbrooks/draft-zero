# docs/024: re-fit the full run's value head on its final network. The value head overfit late in the run (validation
# log-loss 0.518 at epoch 7, ~0.556 by epoch 20.8, against 0.43 on training rows) while the policy improved to the
# end, and policy and value share one trunk, so an earlier checkpoint's head can't be moved across. Here the final
# network is frozen (dropout 0, so the head sees the features it will see in play) and only its value head (2 layers,
# ~66k parameters) is trained, on the game result, with the best validation log-loss kept: one network, the policy
# unchanged.
#
#   python -m draftzero.gameplay.graph_supervised train --config configs/gnn_full_r1_valuefit.yml \
#       --out runs/gnn/full_r1_valuefit --tables-dir data/imitation_graph/slim
tables:
  - {name: turnstart, kind: priority_set}
  - {name: replay_priority, kind: priority_set}
  - {name: opp_priority, kind: priority_set}
  - {name: replay_attack, kind: binary}
  - {name: replay_target, kind: target}
  - {name: opp_block, kind: target}
fraction: 1.0
val_rows: 20000
data_cache: /home/researcher/gnn-cache
stream_cache: true
arch: {d_model: 256, ff: 1024, dropout: 0.0}
init_checkpoint: runs/gnn/full_r1/final.pt.gz
train_only: [value_head]
policy_weight: 0.0
binary_weight: 0.0
target_weight: 0.0
value_weight: 1.0
value_target: result
value_per_game: 16
act_weights: {}
lr: 1.0e-3
warmup_steps: 200
lr_schedule: cosine
batch_rows: 256
sample_block_rows: 32
sample_window_blocks: 64
max_epochs: 1
time_budget_s: 7200
eval_every_steps: 5325         # an eighth of an epoch: the best point may come early
ckpt_every_s: null
latest_every_s: 600
