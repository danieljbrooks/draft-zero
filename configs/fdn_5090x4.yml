# FDN generalist on 4x RTX 5090 secure, EUR-IS-1: 192 vCPU (163 usable) / 350GB, $3.96/hr.
# Network volume + HF push, so weights are doubly safe. Sized to actually USE the cores:
# 96 game threads of 163, so self-play runs wide. Whether that converts to games is the open
# question -- the inference server is a single worker_loop, and the [PHASE] line reveals if it
# saturates. Cost is bounded by DZ_MAX_HOURS at launch, since $3.96/hr only pays off if the
# extra cores convert.
model: FDN_generalist
version: 1
generations: null
target_games: 2500
resource_interval_s: 30

bootstrap_games: 128
games_per_gen: 96            # more games/gen to amortize the wider self-play
chunk_games: 96             # ALSO caps the JVM thread pool; must stay >= jvm.threads
mix: {self: 0.7, past: 0.2, gen0: 0.1}
replay_states: 200000

eval:
  baselines: [offline]
  every_n_gens: 5
  pairs: 20
  fixed_decks: true
  window_gens: 10
stats:
  window_gens: 10
  min_card_games: 30

jvm:
  heap: 96g                  # of 350GB
  threads: 96                # of 163 usable cores -- wide self-play, room for inference+torch
  search_budget: 96
  timeout_ms: 12000
  max_minutes: 25
