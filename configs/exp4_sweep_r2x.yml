# Experiment #4, stage 2, round 2 on a second machine (docs/018): the same data, validation rows and budget as
# round 2 (one epoch of the 10% subset), the leader's recipe in the base. First a reference run of the leader
# itself, to check that the other hardware reproduces round 2's numbers within the seed noise (±0.006 on the
# policy), then the passivity fix: every network so far tops Pass in the opponent's turn ~97–99% of the time,
# against the humans' 93%; act_weights upweight the policy loss of the rows where the human acted.
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_r2x.yml --out runs/exp4/sweep_r2x \
#       --tables-dir data/imitation_scale/h5 --follow --follow-idle 7200
title: "Experiment #4 sweep, round 2 (second machine): hardware check and the passivity fix"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  val_rows: 20000
  max_epochs: 1.0
  time_budget_s: 7200
  eval_every_s: null
  eval_every_steps: 5169
  ckpt_every_s: null
  latest_every_s: 300
  patience_epochs: null
  # round 2's leader, v16-td-cosine-1e-4
  arch: {layers: 1, norm_first: true}
  emb_init_std: 0.02
  warmup_steps: 3000
  lr: 1.0e-4
  lr_schedule: cosine
  value_target: td
  value_per_game: 16
runs:
  - {name: hw-ref, role: default}                               # = round 2's v16-td-cosine-1e-4
  - {name: act-opp-3, act_weights: {opp_priority: 3.0}}
  # 20:45 (Dan): TD(lambda) around the leader's 0.95 (lower: more bootstrapping, smoother, more bias; higher: closer
  # to the plain result)
  - {name: td-0.90, td_lambda: 0.90}
  - {name: td-0.975, td_lambda: 0.975}
  - {name: td-0.99, td_lambda: 0.99}
  # 20:52: 30% of the games for one epoch beats every 10% run by far (NLL 0.262 against 0.287). Is that the
  # data or the 3x steps? The leader for three epochs of the 10% subset (the 30% run's steps) tells them apart,
  # and how many epochs stage 3 can usefully repeat.
  - {name: ep3, max_epochs: 3.0}
  # 21:13: TD(lambda) is a clean trade (lower: policy, higher: value); 0.975 and 0.99 are within noise of each other.
  # 21:20 (Dan): 0.99, since a game has ~75 decisions and 0.95 bootstraps from ~20 ahead. Does it stack with the
  # passivity fix? (0.975 alongside, as a check.)
  - {name: act3-td99, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: act3-td975, act_weights: {opp_priority: 3.0}, td_lambda: 0.975}
  # 21:52: they stack (act3-td99: the value of TD 0.99, the passing and most of the policy gain of act x3): the new
  # leader. The runs below are re-based on it.
  - {name: act-opp-10, act_weights: {opp_priority: 10.0}, td_lambda: 0.99}
  - {name: act-all-3, act_weights: {opp_priority: 3.0, replay_priority: 3.0, turnstart: 3.0}, td_lambda: 0.99}
  # 22:20 (Dan: which architectures for stage 3?): the two TransformerNetX options built for round 2 but deferred, on
  # the leader: a separate value tower (the value head overfits; give it its own layer), and SwiGLU + attention pooling
  - {name: x-value-tower, arch: {value_tower: true, value_layers: 1}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: x-swiglu-attnpool, arch: {ffn: swiglu, pool: attn}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # 22:55 (Dan): stage 3 trains two models to completion, the transformer for quality and an MLP for fast CPU search
  # (one CPU core: MLP 0.39 ms an evaluation, the 1-layer transformer ~80 ms). The MLP has only ever run on the
  # transformer's recipe: tune it. On the leader's recipe (TD 0.99, act x3 on the opponent's turn) unless noted.
  - {name: m-base, arch: {type: mlp, layers: 2}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-lr-3e-4, lr: 3.0e-4, arch: {type: mlp, layers: 2}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-lr-1e-3, lr: 1.0e-3, arch: {type: mlp, layers: 2}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-w1024, arch: {type: mlp, layers: 2, width: 1024}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-w1024-b4, arch: {type: mlp, layers: 4, width: 1024}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-w2048, arch: {type: mlp, layers: 2, width: 2048}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-nodrop, arch: {type: mlp, layers: 2, dropout: 0.0, pool_dropout: 0.0}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  - {name: m-actall3, arch: {type: mlp, layers: 2}, act_weights: {opp_priority: 3.0, replay_priority: 3.0, turnstart: 3.0}, td_lambda: 0.99}
  # ---- superseded at 22:55 by the MLP tuning above (2 layers lost at 30%; the MLP runs moved up)
  # - {name: x-l2, arch: {layers: 2}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # - {name: x-mlp, arch: {type: mlp, layers: 2}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # - {name: x-mlp-w1024-b4, arch: {type: mlp, layers: 4, width: 1024}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
  # - {name: x-l4, arch: {layers: 4}, act_weights: {opp_priority: 3.0}, td_lambda: 0.99}
