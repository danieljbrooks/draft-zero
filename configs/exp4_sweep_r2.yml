# Experiment #4, stage 2, round 2 (docs/018): the sweep's fixes combined. Round 1 (exp4_sweep.yml) found
# MageZero's default (2 post-LN layers, width 512, N(0, 1) embedding rows, lr 3e-4) trains unstably:
# lr 1e-4 helped every head, an embedding init of std 0.02 helped the attack and value heads, pre-LN
# helped the policy, a longer warm-up alone did nothing, and the 1-layer, width-256 and MLP networks beat
# the default. Same data, vocab, validation rows and budget as round 1 (one epoch of the 10% subset), so
# the two rounds compare directly.
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_r2.yml --out runs/exp4/sweep_r2 \
#       --tables-dir data/imitation_scale/h5
#
# The reference is round 2's `ref`: MageZero's shape (it loads into MageZero's server unchanged) at
# lr 1e-4 with the 0.02 embedding init, with a second seed for the noise band.
title: "Experiment #4 sweep, round 2: the round-1 fixes combined"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  val_rows: 20000
  max_epochs: 1.0
  time_budget_s: 7200
  eval_every_s: null
  eval_every_steps: 5169      # quarter epochs, as round 1's later runs
  ckpt_every_s: null
  latest_every_s: 300
  patience_epochs: null
  value_per_game: 4
  lr: 1.0e-4                  # round 1: better than 3e-4 on every head
  emb_init_std: 0.02          # round 1: fixes the attack and value heads at 3e-4
runs:
  # the reference and its noise band
  - {name: ref, role: default, seed: 0}
  - {name: ref-seed1, role: default, seed: 1}
  # a value tower: does a value head with its own features help both heads (round 1: value weight 0.1 helped
  # the policy and hurt the value, so the shared trunk trades one against the other)?
  - {name: value-tower, arch: {value_tower: true, value_layers: 1}}
  # pre-LN at the lower learning rate, and at a higher one (pre-LN tolerates more)
  - {name: pre-ln, arch: {norm_first: true}}
  - {name: pre-ln-lr-5e-4, arch: {norm_first: true}, lr: 5.0e-4, warmup_steps: 2000}
  # the small networks of round 1 at the fixed recipe
  - {name: layers-1, arch: {layers: 1}}
  - {name: width-256, arch: {width: 256}}
  # the MLP: a higher learning rate (pre-norm residual blocks), and a bigger one
  - {name: mlp-lr-1e-3, arch: {type: mlp}, lr: 1.0e-3}
  - {name: mlp-wide, arch: {type: mlp, width: 1024, layers: 4}, lr: 3.0e-4}
  # the learning-rate schedule around the reference
  - {name: lr-2e-4, lr: 2.0e-4}
  - {name: cosine-2e-4, lr: 2.0e-4, lr_schedule: cosine, warmup_steps: 1000}
  # less dropout: one epoch is far from overfitting, and 30% token dropout slows learning
  - {name: token-dropout-0.1, token_dropout: 0.1}
  - {name: no-dropout, token_dropout: 0.0, arch: {dropout: 0.0, pool_dropout: 0.0}}
  # transformer variants
  - {name: swiglu-attnpool, arch: {ffn: swiglu, pool: attn}}
  # depth, now that it might train
  - {name: layers-4-pre-ln, arch: {layers: 4, norm_first: true}}
