# Experiment #4, stage 2, round 2 (docs/018): a hill climb around round 1's leaders, run with --follow so
# runs can be added and reordered while it goes (the sweep re-reads this file before every run).
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_r2.yml --out runs/exp4/sweep_r2 \
#       --tables-dir data/imitation_scale/h5 --follow --follow-idle 7200
#
# Round 1 (exp4_sweep.yml): MageZero's default (2 post-LN layers, width 512, N(0, 1) embedding rows,
# lr 3e-4) trains unstably. 1 layer, width 256 and lr 1e-4 each beat it; pre-LN, a 0.02 embedding init and
# a 3k warm-up together ("modern") made 2 layers as good as 1. The MLP was close and ~24x faster.
#
# The base here, c0, combines them: 1 layer, width 512, pre-LN, embedding std 0.02, 3k warm-up, lr 3e-4.
# Same data, vocab, validation rows and budget (one epoch of the 10% subset) as round 1.
title: "Experiment #4 sweep, round 2: a hill climb around 1 layer with the round-1 fixes"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  val_rows: 20000
  max_epochs: 1.0
  time_budget_s: 7200
  eval_every_s: null
  eval_every_steps: 5169      # quarter epochs
  ckpt_every_s: null
  latest_every_s: 300
  patience_epochs: null
  value_per_game: 4
  arch: {layers: 1, norm_first: true}
  emb_init_std: 0.02
  warmup_steps: 3000
  lr: 3.0e-4
runs:
  # ---- done or running
  - {name: c0, role: default, seed: 0}
  - {name: c0-lr-1e-4, lr: 1.0e-4}          # -> the leader (10:54): same policy, better attack, block and value
  - {name: c0-lr-6e-4, lr: 6.0e-4}
  # ---- the stack: newest ideas first (each check-in puts new runs here)
  # 10:54: the policy is flat across learning rates, the value/attack/block heads want a low one: a cosine
  # decay could give both (fast early learning, a low rate late)
  - {name: c0-cosine-3e-4, lr: 3.0e-4, lr_schedule: cosine}
  # 11:21: lr 6e-4 is worse (NLL +0.020, attack −0.032): lower keeps winning, so try lower still next
  - {name: c0-lr-5e-5, lr: 5.0e-5}
  # 11:47: cosine from 3e-4 gives the best non-Pass top-1 (0.766) but a worse value (AUC 0.712): the value head
  # wants small constant steps. Maybe it's starved of data instead: it trains on only 4 positions a game
  # an epoch (value_per_game), ~58k value samples in this epoch. Give it 4x as many on the leader.
  - {name: l1e4-vpg16, lr: 1.0e-4, value_per_game: 16}
  # 12:14: lr 5e-5 leads (non-Pass 0.776, NLL 0.305, attack 0.803, value AUC 0.737): lower keeps winning
  - {name: c0-lr-2e-5, lr: 2.0e-5}
  # 12:41: 16 value positions a game (lr 1e-4) gives the best policy of any run (non-Pass 0.784, NLL 0.295,
  # target 0.574) and the best value log-loss (0.617): the result is a useful signal for the shared trunk
  # once training is stable. Combine it with lr 5e-5, and push it to every position.
  - {name: l5e5-vpg16, lr: 5.0e-5, value_per_game: 16}
  - {name: l5e5-vpg-all, lr: 5.0e-5, value_per_game: null}
  # the width probes and the tricks, re-based on the leader (lr 5e-5)
  - {name: l5e5-w256, lr: 5.0e-5, arch: {width: 256}}
  # 14:02: the value loss on every position gives the best policy (non-Pass 0.792, NLL 0.288) but the value head
  # memorises games (log-loss 0.606 at a quarter epoch, 0.846 at the end). Try the middle, and a within-game target.
  - {name: l5e5-vpg32, lr: 5.0e-5, value_per_game: 32}
  - {name: l5e5-vpg16-aux, lr: 5.0e-5, value_per_game: 16, aux_targets: [turns_left]}
  # 14:49: 32 value positions overfits the value head too (log-loss 0.591 at half an epoch, 0.648 at the end) for a
  # policy gain within noise: 16 is the value head's sweet spot. Decouple: a throwaway "result" head on every
  # position feeds the trunk the outcome signal (as every-position did for the policy), the value head keeps 16.
  # 15:45 (Dan: a mid-game value is a fraction, not ±1): TD(0.95) targets bootstrap from the network's own values,
  # so they are fractions with far less variance than the result. Round 1's TD run was at the unstable 3e-4;
  # retest it on the leader (an existing option: no pipeline change).
  - {name: v16-td, lr: 5.0e-5, value_per_game: 16, value_target: td}
  # 16:10 (Dan: warm-up + cosine has worked well elsewhere): cosine from 3e-4 beat constant 3e-4 but spent most of
  # the epoch above the best constant rate (5e-5). Cosine at the right scale, on the leader's recipe:
  - {name: v16-cosine-1e-4, lr: 1.0e-4, lr_schedule: cosine, value_per_game: 16}
  - {name: v16-cosine-2e-4, lr: 2.0e-4, lr_schedule: cosine, value_per_game: 16}
  # 16:00 (Dan: the result head approved; the goal is a recipe that works at full scale, and whether capacity
  # helps with the right recipe). A throwaway result head on every position feeds the trunk the outcome signal
  # (every-position gave the best policy) while the value head keeps 16 positions.
  - {name: l5e5-vpg16-auxres, lr: 5.0e-5, value_per_game: 16, aux_targets: [result], aux_weight: 0.5}
  # capacity on the leader's recipe (pre-LN, std 0.02, lr 5e-5, 16 value positions)
  - {name: v16-w1024, lr: 5.0e-5, value_per_game: 16, arch: {width: 1024}}
  - {name: v16-l2, lr: 5.0e-5, value_per_game: 16, arch: {layers: 2}}
  - {name: v16-l4, lr: 5.0e-5, value_per_game: 16, arch: {layers: 4}}
  # the MLP on the recipe, and a big one (they are fast)
  - {name: v16-mlp-lr-1e-4, lr: 1.0e-4, value_per_game: 16, arch: {type: mlp, layers: 2}}
  - {name: v16-mlp-w1024-b4, lr: 1.0e-4, value_per_game: 16, arch: {type: mlp, layers: 4, width: 1024}}
  # the noise band for the leader
  - {name: v16-seed1, lr: 5.0e-5, value_per_game: 16, seed: 1}
  # ---- deferred (16:00): after the 30%-data scale check (configs/exp4_sweep_s30.yml)
  # - {name: v16-w128, lr: 5.0e-5, value_per_game: 16, arch: {width: 128}}
  # - {name: v16-mlp-lr-1e-3, lr: 1.0e-3, value_per_game: 16, arch: {type: mlp, layers: 2}}
  # - {name: v16-mlp-b4, lr: 1.0e-4, value_per_game: 16, arch: {type: mlp, layers: 4}}
  # - {name: v16-mlp-nodrop, lr: 1.0e-4, value_per_game: 16, token_dropout: 0.1, arch: {type: mlp, layers: 2, dropout: 0.0, pool_dropout: 0.0}}
  # - {name: v16-value-tower, lr: 5.0e-5, value_per_game: 16, arch: {value_tower: true, value_layers: 1}}
  # - {name: v16-swiglu-attnpool, lr: 5.0e-5, value_per_game: 16, arch: {ffn: swiglu, pool: attn}}
  # - {name: v16-token-dropout-0.1, lr: 5.0e-5, value_per_game: 16, token_dropout: 0.1}
  # ---- dropped (Dan, 16:00): the original lr-3e-4 backstop
