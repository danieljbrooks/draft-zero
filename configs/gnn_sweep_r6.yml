# docs/022, stage 2, round 6 (docs/023): repeats. Three epochs of the same 10% at width 256 and lr 1e-4 (r5-3ep)
# reached set NLL 0.256, past the MLP's best at 10% (0.258) and experiment #4's transformer at three epochs (0.269),
# still falling at the end. How far do repeats go (5 epochs), does the faster rate (2e-4, the best at one epoch) win
# over three, and does Will's width 512 gain more from repeats than 256? Base: round 5's (three epochs).
#
#   SPEC=configs/gnn_sweep_r6.yml OUT=runs/gnn/sweep_r1f bash deploy/gnn_sweep.sh 0 r6-5ep,r6-3ep-lr2e-4,r6-3ep-d512 data/imitation_graph/slim
title: "docs/022 stage 2, round 6: repeats"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  val_rows: 20000
  max_epochs: 3.0
  time_budget_s: 3600
  eval_every_steps: 1075
  ckpt_every_s: null
  latest_every_s: 600
  batch_rows: 256
  lr: 1.0e-4
  warmup_steps: 750
  emb_init_std: 0.02
  value_target: result
  arch: {dropout: 0.1, d_model: 256, ff: 512}
runs:
  - {name: r6-5ep, max_epochs: 5.0}
  - {name: r6-3ep-lr2e-4, lr: 2.0e-4}
  - {name: r6-3ep-d512, arch: {dropout: 0.1, d_model: 512, ff: 1024}}
