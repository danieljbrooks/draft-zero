# Experiment #4, stage 2: the hyperparameter sweep (docs/017 §6.3). One setting at a time around the
# default (MageZero v0.2's network: 2 layers, width 512, lr 3e-4), plus the default with a second seed
# for the noise band. Every run gets the same 10% of the training games, the same feature vocab, the
# same validation rows and the same number of samples: one epoch of that subset (docs/018 §Stage 2).
# docs/017 §6.3 planned an equal 25-minute budget instead; that gives faster networks more data.
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep.yml --out runs/exp4/sweep \
#       --tables-dir data/imitation_scale/h5
#
# Writes runs/exp4/sweep/{sweep.json,sweep.csv,sweep-light.png,sweep-dark.png} and one run directory
# per config (evals.jsonl, best_*.pt.gz, speed.json). Re-running the command skips finished runs and
# resumes an interrupted one. The rule (docs/017 §6.3): keep the default unless a setting beats it by
# more than twice the seed-to-seed difference, is no worse on the other head, and slows inference by
# less than 25%.
title: "Experiment #4 sweep: one setting at a time around MageZero's default network"
base:
  # the tables tools/imitation_scale/build.py writes (docs/017 §2.2, §8.1)
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
    # - {name: block, kind: target}     # overlaps opp_block
  fraction: 0.1               # of the training games, the same 10% for every run
  val_rows: 20000             # per table, whole games
  max_epochs: 1.0             # one pass over the 10% subset: the same samples for every run
  time_budget_s: 7200         # a cap only (the default needs ~27 minutes)
  eval_every_s: null          # learning curves at the same epochs for every run: 0, 0.25, 0.5, 0.75 and 1.0
  eval_every_steps: 5169      # (an epoch of the subset is 20,675 steps whatever the network; the last is the stop)
  ckpt_every_s: null          # the best checkpoints are kept; no periodic ones
  latest_every_s: 300
  patience_epochs: null       # fixed budget: no plateau stop
  value_per_game: 4           # docs/017 §5: a few positions per game per epoch for the value loss
runs:
  - {name: default, role: default, seed: 0}
  - {name: default-seed1, role: default, seed: 1}
  - {name: layers-1, arch: {layers: 1}}
  - {name: layers-4, arch: {layers: 4}}
  - {name: width-256, arch: {width: 256}}
  - {name: width-768, arch: {width: 768}}
  - {name: mlp, arch: {type: mlp}}                 # mean-pooled EmbeddingBag + 2 residual MLP blocks
  - {name: lr-1e-4, lr: 1.0e-4}
  - {name: lr-1e-3, lr: 1.0e-3}
  - {name: value-td, value_target: td}             # TD(0.95) targets from the network's own values
  - {name: value-aux, aux_targets: [turns_left]}   # + life_diff once the build writes meta/final_life_diff
  - {name: value-td-aux, value_target: td, aux_targets: [turns_left]}
  - {name: value-weight-0.1, value_weight: 0.1}   # #2b's 0.5 was for MSE; cross-entropy has another scale
  # transformer initialisation and warm-up (added after the first runs: 4 layers learned no attack or value head
  # in one epoch, and 1 layer beat the default 2). MageZero's default: post-LN layers, N(0, 1) embedding rows,
  # 300 warm-up steps of ~20.7k an epoch. Warm-up and the embedding init keep MageZero's shape; pre-LN doesn't.
  - {name: warmup-3k, warmup_steps: 3000}
  - {name: emb-std-0.02, emb_init_std: 0.02}
  - {name: pre-ln, arch: {norm_first: true}}
  - {name: modern, arch: {norm_first: true}, emb_init_std: 0.02, warmup_steps: 3000}
  - {name: layers-4-modern, arch: {layers: 4, norm_first: true}, emb_init_std: 0.02, warmup_steps: 3000}
