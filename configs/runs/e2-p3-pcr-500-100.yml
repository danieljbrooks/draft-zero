# E2 arm P3: KataGo-style playout-cap randomization. A quarter of the decisions get a deep 500-simulation search
# (with root noise, recorded); the rest a 100-simulation one (no noise, argmax, not recorded).
#
# Equal compute: compared with e2-p0-control at equal actor CPU-hours (same machines, same budget.max_hours), not at
# equal versions; only actor.* differs. Mean simulations a decision: 0.25*500 + 0.75*100 = 200, the control's budget,
# spent on fewer, deeper policy targets.
# Launch with the run's bucket: --store hf://buckets/danbrooks/dz-e2-p3-pcr-500-100
extends: base/player.yml
run: e2-p3-pcr-500-100
actor:
  sims: 500
  pcr: {prob: 0.25, cheap_sims: 100}
store: runs/e2-p3-pcr-500-100
