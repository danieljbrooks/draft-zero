# Experiment #4, stage 3: the large training (docs/017 §6.4), with the recipe the sweep chose (docs/018, stage 2):
# 1 layer with pre-LN, embedding std 0.02, warm-up + cosine from 1e-4, TD(0.99) value targets on 16 positions a
# game, and the passivity fix (x3 on the policy loss of the rows where the human acted). Three epochs, not the
# plan's plateau rule: cosine needs a fixed length, and the 10%-subset runs showed the policy still gains from
# repeats while the value head peaks early (best_policy and best_value are kept apart).
#
#   python -m draftzero.gameplay.supervised train --config configs/exp4_train.yml --out runs/exp4/main \
#       --tables-dir data/imitation_scale/h5
#   # after a pod restart or a kill (SIGTERM saves latest.pt first):
#   python -m draftzero.gameplay.supervised train --out runs/exp4/main --resume
#
# Writes runs/exp4/main/: evals.jsonl (every evaluation), best_policy / best_value / best .pt.gz
# (MageZero's format), ckpt/step*.pt.gz every 30 minutes, latest.pt (resume state), final.pt.gz,
# summary.json.
# the tables tools/imitation_scale/build.py writes (docs/017 §2.2, §8.1)
tables:
  - {name: turnstart, kind: priority_set}         # the turn's first main-phase priority, set labels
  - {name: replay_priority, kind: priority_set}   # the player's later stops in its own turn (timing)
  - {name: opp_priority, kind: priority_set}      # the player's stops in the opponent's turn (timing)
  - {name: replay_attack, kind: binary}           # "attack with X?"
  - {name: replay_target, kind: target}           # spell targets the outcome settles
  - {name: opp_block, kind: target}               # every block question, from the opponent's turn
  # - {name: block, kind: target}                 # the first block question of each attack: overlaps opp_block
fraction: 1.0
val_rows: 20000
# The feature vocab is unbounded (every feature in more than vocab_k = 10 training states: 72,404 on all the rows).
# Past 65,535 features the rows are ordered by frequency and the tables stored in 16 bits plus the rarest features'
# overflow (supervised.RowStore): ~18 GB of tokens for all the rows rather than ~36 as int32, which overran the
# second machine's 40 GiB on the first launch. vocab_max_features is only a memory ceiling, for an OOM.
data_cache: data/cache/supervised        # mapped tables, so a resume skips the vocab mapping
arch: {type: transformer, layers: 1, width: 512, norm_first: true}
emb_init_std: 0.02
warmup_steps: 3000
lr: 1.0e-4
lr_schedule: cosine
value_target: td
td_lambda: 0.99
value_per_game: 16
act_weights: {opp_priority: 3.0, replay_priority: 3.0}   # x3 on the rows where the human acted; deploy/exp4_stage3.sh adds the
                                                        # turn start if the 30% check favours it (tools/imitation_scale/stage3_choice.py)
value_weight: 0.5           # the value loss's weight; 0.2 if its 30% check passes (stage3_choice.py)
time_budget_s: 43200        # a 12-hour cap; max_epochs stops it first
max_epochs: 3
eval_every_s: null
eval_every_steps: 26000     # about an eighth of an epoch (~209k steps of ~52 rows)
ckpt_every_s: 1800
latest_every_s: 600
patience_epochs: null       # the cosine schedule sets the length
