# End-to-end check of the generalist loop in ~15 minutes: tiny games, 4 gens.
model: FDN_generalist_smoke
version: 1
generations: 4
bootstrap_games: 4
games_per_gen: 6
chunk_games: 2
mix: {self: 0.5, past: 0.3, gen0: 0.2}
replay_states: 3000
eval: {baselines: [offline, minimax], pairs: 1, window_gens: 2}
stats: {window_gens: 2, min_card_games: 1}
jvm: {heap: 6g, threads: 2, search_budget: 30, timeout_ms: 2000, max_minutes: 6}
