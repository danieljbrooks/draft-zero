# FDN generalist on a community RTX 3090: 25 vCPU / 50 GB / 24 GB VRAM at $0.22/hr.
#
# Why this box: self-play is CPU-bound XMage/MCTS and the GPU measured 2-8% utilisation,
# so the right axis is vCPU per dollar. This offer gives 114 vCPU/$ against 28.6 for an
# RTX 4000 Ada -- an older, smaller GPU bundled with three times the cores, which is
# exactly the shape this workload wants.
#
# Community cloud has NO network volume, so checkpoints live on the pod's volume disk and
# must be pulled off periodically. Generations are ~1.9h here (vs 3.2h on the 4000 Ada),
# so the checkpoint cadence is better, and a ~4 day run limits exposure to a host vanishing.
#
# Throughput: the 4000 Ada measured 20.7 games/hr at budget 96 on a 7.65-core quota.
# Scaling to 25 cores at 0.85 efficiency (threads block on inference ~40% of the time)
# predicts ~57 games/hr. THIS IS AN EXTRAPOLATION -- generation 1 confirms or refutes it.
model: FDN_generalist
version: 1
generations: null
target_games: 4200           # counts every game in games.jsonl, eval and league included.
                             # Deliberately small: prove the pipeline, get a learning curve,
                             # then raise this and continue with --extend, which keeps the
                             # generation numbering, history and past-checkpoint pool.
resource_interval_s: 30

bootstrap_games: 96          # gen 0: heuristic both sides, much faster than network play
games_per_gen: 72            # ~1.3h play -> a ~1.9h generation, ~51 generations to target
chunk_games: 24              # ALSO caps the JVM thread pool, so must stay >= jvm.threads
mix: {self: 0.7, past: 0.2, gen0: 0.1}
replay_states: 150000        # ~10 generations at 72 games x 2 players x ~100 states

eval:
  baselines: [offline, minimax]
  pairs: 2                   # 8 eval games/gen; pooled over the window for a usable CI
  window_gens: 8
stats:
  window_gens: 10
  min_card_games: 30

jvm:
  heap: 32g                  # of 50 GB; the 4000 Ada peaked at 17.5 GB with 8 threads
  threads: 20                # of 25 cores, leaving room for the inference server + trainer
  search_budget: 96
  timeout_ms: 12000
  max_minutes: 25
