# docs/022, stage 3: the GNN's large training. Provisional: the sweep (configs/gnn_sweep.yml) sets the
# architecture and the optimiser, and the 30% scale check sets the number of epochs (docs/022 §4.3). Until then
# this is MageZero's graph network as Will wrote it with experiment #4's final recipe, on all the training games.
#
#   python -m draftzero.gameplay.graph_supervised train --config configs/gnn_train.yml --out runs/gnn/main \
#       --tables-dir data/imitation_graph/h5
#   python -m draftzero.gameplay.graph_supervised train --out runs/gnn/main --resume            # after a stop
#   python -m draftzero.gameplay.graph_supervised evaluate --checkpoint runs/gnn/main/best_policy.pt.gz \
#       --split test --tables-dir data/imitation_graph/h5 --json runs/gnn/main/test_best_policy.json
#
# Writes runs/gnn/main/: evals.jsonl, best_policy / best_value / best .pt.gz (MageZero's graph checkpoint layout:
# its own server loads them when the arch is the default), ckpt/step*.pt.gz every 30 minutes, latest.pt, final.pt.gz,
# summary.json.
tables:
  - {name: turnstart, kind: priority_set}
  - {name: replay_priority, kind: priority_set}
  - {name: opp_priority, kind: priority_set}
  - {name: replay_attack, kind: binary}
  - {name: replay_target, kind: target}
  - {name: opp_block, kind: target}
fraction: 1.0
val_rows: 20000
data_cache: data/cache/graph   # the mapped graph arrays as .npy, memory-mapped: all the rows need ~50 GB, more than r1's RAM
arch: {type: graph}            # graph_net.ARCH_DEFAULT: d_model 512, 4 heads, ff 1024, 2 local passes, 2 global layers
lr: 1.0e-4
warmup_steps: 3000
lr_schedule: cosine
value_target: td
td_lambda: 0.99
value_per_game: 16
value_weight: 0.5
act_weights: {opp_priority: 3.0, replay_priority: 3.0}
batch_rows: 64
max_epochs: 1                  # the 30% check decides between 1 and 2-3 (docs/022 §4.3)
time_budget_s: 86400
eval_every_steps: 42800        # about a quarter epoch (~171k steps of 64 states)
ckpt_every_s: 1800
latest_every_s: 600
