# docs/028 stage 1: one training step from the start network, every arm on the same games (stage 0's d0-v0-n100).
#   python tools/selfplay_transition/sp_train.py --spec configs/sp/stage1.yml --arm <arm> \
#       --batches runs/sp/batches/d0 --out runs/sp/arms/<arm>
# Stage 1b's arms build on the 1a winner: its settings are copied into each 1b arm once 1a is scored (docs/028 §4.2).
base:
  start: runs/gnn/full_r1/best_policy_calibrated.pt.gz
  td_lambda: 0.99
  heldout_share: 0.1
  epochs: 2
  eval_every: 400
  lr_schedule: cosine
  lr_min_frac: 0.1
  select: final
  human_val: {config: configs/gnn_full_r1.yml, tables_dir: data/imitation_graph/slim, every: 1}
  trainer:
    batch_rows: 256
    lr: 3.0e-5
    warmup_steps: 100
    value_weight: 0.5
    value_per_game: 16
    kl_weight: 0.0
    kl_weight_end: 0.0
    kl_mask_use: true
    cq_visit_shrink: 2.0
    seed: 1
arms:
  # ---- 1a: the policy target
  visits: {}
  kl: {trainer: {kl_weight: 1.0, kl_weight_end: 1.0}}
  cq10: {trainer: {policy_target: cq, cq_scale: 10.0}}
  cq30: {trainer: {policy_target: cq, cq_scale: 30.0}}
  # ---- 1b: the value and the anchor, on the 1a winner (cq10: the Q-tilted target at s = 10; docs/029)
  b_lam1: {td_lambda: 1.0, trainer: {policy_target: cq, cq_scale: 10.0}}
  b_lam95: {td_lambda: 0.95, trainer: {policy_target: cq, cq_scale: 10.0}}
  b_vwarm:
    trainer: {policy_target: cq, cq_scale: 10.0}
    phases:
      - {share: 0.25, td_lambda: 1.0, trainer: {policy_weight: 0.0, train_only: [value_head], lr: 3.0e-4}}
      - {share: 0.75, td_lambda: 0.99}
  b_vonly: {trainer: {policy_weight: 0.0, kl_weight: 10.0, kl_weight_end: 10.0}}
  b_human: {trainer: {policy_target: cq, cq_scale: 10.0, human_share: 0.25, human_tables_dir: data/imitation_graph/slim,
                      human_data_cache: /home/researcher/gnn-cache, human_value_weight: 0.0}}
  b_lr1e4: {trainer: {policy_target: cq, cq_scale: 10.0, lr: 1.0e-4}}
