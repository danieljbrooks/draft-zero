# Experiment #4: the MLP's feature-embedding dimension, apart from its width (Dan, 2026-10-03 16:50; docs/018).
# arch.emb_dim = e: features embedded and max-pooled at size e, then one linear layer to the width (1024, fixed).
# The recipe is the best MLP's (wave 4's m4-best / s30-mlp-m3best-w1024): 2 blocks, width 1024, max pooling,
# SwiGLU, no dropout, token dropout 0.1, the passivity fix on both own-turn tables, TD(0.99). e = 1024 is the
# control: no projection, the same network as m4-best. 10% of the games, one epoch each.
#
#   python -m draftzero.gameplay.supervised sweep --spec configs/exp4_sweep_emb.yml --out runs/exp4/sweep_emb \
#       --tables-dir data/imitation_scale/h5 --follow --follow-idle 1800
title: "Experiment #4 sweep: the MLP's embedding dimension (10%)"
base:
  tables:
    - {name: turnstart, kind: priority_set}
    - {name: replay_priority, kind: priority_set}
    - {name: opp_priority, kind: priority_set}
    - {name: replay_attack, kind: binary}
    - {name: replay_target, kind: target}
    - {name: opp_block, kind: target}
  fraction: 0.1
  val_rows: 20000
  max_epochs: 1.0
  time_budget_s: 7200
  eval_every_s: null
  eval_every_steps: 5169
  ckpt_every_s: null
  latest_every_s: 300
  patience_epochs: null
  arch: {type: mlp, layers: 2}
  emb_init_std: 0.02
  warmup_steps: 3000
  lr: 1.0e-4
  lr_schedule: cosine
  value_target: td
  td_lambda: 0.99
  value_per_game: 16
  act_weights: {opp_priority: 3.0}
runs:
  - {name: e64, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, arch: {type: mlp, layers: 2, width: 1024, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, emb_dim: 64}}
  - {name: e128, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, arch: {type: mlp, layers: 2, width: 1024, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, emb_dim: 128}}
  - {name: e256, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, arch: {type: mlp, layers: 2, width: 1024, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, emb_dim: 256}}
  - {name: e512, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, arch: {type: mlp, layers: 2, width: 1024, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, emb_dim: 512}}
  - {name: e1024, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, arch: {type: mlp, layers: 2, width: 1024, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, emb_dim: 1024}}
  - {name: e2048, token_dropout: 0.1, act_weights: {opp_priority: 3.0, replay_priority: 3.0}, td_lambda: 0.99, arch: {type: mlp, layers: 2, width: 1024, bag_mode: max, ffn: swiglu, dropout: 0.0, pool_dropout: 0.0, emb_dim: 2048}}
