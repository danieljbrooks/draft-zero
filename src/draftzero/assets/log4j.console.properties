# XMage logging for DraftZero's JVMs: stdout only, which the loop captures per JVM.
# The line format matches the MageZero bundle's log4j.properties, so draftzero.metrics.LINE_RE
# parses it. The bundle's file appenders are left out: several JVMs share one xmage/ directory.
log4j.rootLogger=info, console
log4j.logger.com.j256.ormlite=warn
log4j.logger.mage.player.ai=info
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n
log4j.appender.console.Threshold=info
log4j.appender.console.filter.1=org.apache.log4j.varia.LevelMatchFilter
log4j.appender.console.filter.1.LevelToMatch=WARN
log4j.appender.console.filter.1.AcceptOnMatch=false
