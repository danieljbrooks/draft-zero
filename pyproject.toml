[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "draftzero"
version = "0.2.0.dev0"
description = "Agents that play Magic: The Gathering limited tournaments end to end"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The game engine is gorge, a Go binary pinned and built by engine/gorge (GORGE_REPO, GORGE_REF, build.sh),
# not a Python dependency. Core stays small: anything heavier is an extra.
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "pyyaml>=6.0",
    "huggingface_hub>=1.0",
]

[project.optional-dependencies]
tracking = ["trackio"]
plots = ["matplotlib"]
sealed = ["pandas", "scipy"]
dev = ["pytest>=7"]

[project.scripts]
dz = "draftzero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"draftzero.nets" = ["SPEC.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: needs a built dzgorge and its card corpus (engine/gorge/build.sh)",
    "smoke: an end-to-end run of the loop on this machine (minutes)",
    "slow: takes more than a few seconds",
]
# `pytest` runs the fast, engine-free tests; `pytest -m engine` (or smoke, slow) runs the others
addopts = '-m "not engine and not smoke and not slow"'
