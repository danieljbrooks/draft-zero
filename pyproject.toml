[project]
name = "draftzero"
version = "0.1.0"
description = "One agent that plays a whole Magic limited format with any deck"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # MageZero supplies the RL framework, the XMage bridge and the training/eval runner.
    # Pinned to a commit, not a branch: a branch pin silently changes what a result was
    # produced against. Bump it deliberately, and record it (provenance.py does).
    # Will's v0.2 (WillWroble/MageZero 11a5974) plus opt-in changes, branch `draftzero`: the
    # policy width for a set-wide action vocabulary (#7, also on `action-vocab`), a CPU
    # fallback, MZ_SERVER_THREADS and MZ_TRAIN_BATCH. Exp #1 ran on the older fork, mz-engine bcc76de; its
    # metrics/report/resources now live in draftzero.
    "magezero @ git+https://github.com/danieljbrooks/MageZero@521a8bd",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "h5py>=3.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dz = "draftzero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
draftzero = ["py.typed", "assets/*"]
