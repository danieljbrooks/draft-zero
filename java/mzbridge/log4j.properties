# Quiet log4j (reload4j 1.2) config for bridge workers: everything to stderr (stdout carries the
# JSON protocol), warnings and errors only. run.sh sets mzb.logLevel from MZB_LOG_LEVEL.
log4j.rootLogger=${mzb.logLevel}, console
log4j.logger.com.j256.ormlite=warn
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%-5p %d{HH:mm:ss,SSS} %c{1} %m%n
